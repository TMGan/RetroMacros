# Production Database (PostgreSQL: Neon free tier)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# OAuth Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${APP_URL}/login/oauth2/code/google

# Server Configuration
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.retromacros=INFO
# --- Portfolio mode ---
# Serve generated meal plans from the built-in offline generator instead of
# calling Anthropic/OpenAI. Keeps hosting cost at zero. Set to false and supply
# CLAUDE_API_KEY to turn live AI generation back on.
ai.mock=true

# Shared demo account button on the login page.
demo.enabled=true

# Never expose the H2 console in production
spring.h2.console.enabled=false
