spring.application.name=Retro Macros
server.port=8080

# AI API Configuration
# Set your key in the CLAUDE_API_KEY environment variable. Never commit it.
ai.api.key=${CLAUDE_API_KEY:}
# Plans and meal swaps use the stronger model; food-log estimates use the cheaper one.
ai.model.plan=claude-sonnet-5-5
ai.model.log=claude-haiku-5-5
# How hard each model works: low, medium or high. Higher costs more and is slower.
ai.effort.plan=low
ai.effort.log=low
ai.timeout.ms=120000
ai.mock=false
ai.repair.enabled=true

# Thymeleaf & logging
spring.thymeleaf.cache=false
logging.level.root=INFO

# --- Google OAuth 2.0 (set your credentials) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email,openid

# --- H2 in-memory DB (dev) ---
spring.datasource.url=jdbc:h2:mem:mealplannerdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security logging (debug during setup)
logging.level.org.springframework.security=INFO

# --- Demo account (portfolio "Explore the demo" button) ---
demo.enabled=true

# --- Access control ---
# When true, only invited emails (Admin > Invites) and ADMIN_EMAILS can sign in.
app.invite-only=false
# Comma-separated Google emails that are always allowed in and are made admins.
app.admin-emails=${ADMIN_EMAILS:}

# --- Daily AI limits per user ---
ai.limit.plans-per-day=2
ai.limit.plans-per-week=5
ai.limit.swaps-per-day=10
ai.limit.estimates-per-day=40

# --- AI spend caps (dollars, rolling 30 days) ---
# Checked before every AI call. Per client: the coach (ADMIN_EMAILS) is exempt.
# Whole app: once reached, AI features pause for everyone until older spend ages out.
# Also set a monthly spend limit in the Anthropic Console as a hard backstop.
ai.budget.user-30d-usd=4.00
ai.budget.global-30d-usd=150.00

# --- Sessions ---
# Sign-ins are stored in the database (Spring Session JDBC) so deploys and restarts
# don't sign everyone out. Tables are created by SessionTableSetup.
spring.session.jdbc.initialize-schema=never
# Clear expired sessions once a day. The default (every minute) would keep the
# Neon database awake around the clock.
spring.session.jdbc.cleanup-cron=0 0 4 * * *
