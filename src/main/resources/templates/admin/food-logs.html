<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin :: adminHead('Food Logs')}"></th:block>
</head>
<body class="neon">
<th:block th:replace="~{fragments/admin :: navbar('logs')}"></th:block>

<div class="container py-4">
    <h2 class="section-title mb-4">Food logs</h2>

    <form method="get" action="/admin/food-logs" class="row g-2 mb-3">
        <input type="hidden" name="userId" th:if="${filterUser != null}" th:value="${filterUser.id}">
        <div class="col-8 col-md-4">
            <input type="date" name="date" class="form-control" th:value="${filterDate}">
        </div>
        <div class="col-4 col-md-2 d-grid">
            <button type="submit" class="btn btn-neon">Filter</button>
        </div>
    </form>

    <div th:if="${filterUser != null || filterDate != null}" class="alert alert-info d-flex justify-content-between align-items-center">
        <span>
            Showing
            <span th:if="${filterUser != null}">entries for <strong th:text="${filterUser.email}">client</strong></span>
            <span th:if="${filterDate != null}">on <strong th:text="${filterDate}">date</strong></span>
        </span>
        <a href="/admin/food-logs" class="btn btn-sm btn-outline-neon">Show all</a>
    </div>

    <div class="card neon">
        <div class="card-body">
            <div class="table-responsive" th:if="${!#lists.isEmpty(foodLogs)}">
                <table class="table table-dark table-hover">
                    <thead><tr><th>Client</th><th>Date</th><th>Meal</th><th>Food</th><th>Cal</th><th>P</th><th>C</th><th>F</th></tr></thead>
                    <tbody>
                    <tr th:each="entry : ${foodLogs}" th:attr="data-href=@{/admin/users/{id}(id=${entry.user.id})}">
                        <td th:text="${entry.user.email}">client</td>
                        <td class="text-nowrap" th:text="${#temporals.format(entry.logDate, 'MMM d, yyyy')}">date</td>
                        <td th:text="${entry.mealName}">Lunch</td>
                        <td th:text="${entry.foodDescription}">food</td>
                        <td th:text="${entry.calories}">0</td>
                        <td th:text="${entry.protein}">0</td>
                        <td th:text="${entry.carbs}">0</td>
                        <td th:text="${entry.fat}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(foodLogs)}" class="empty-state">No food logged yet.</div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
