<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin :: adminHead('Meal Plan')}"></th:block>
</head>
<body class="neon">
<th:block th:replace="~{fragments/admin :: navbar('plans')}"></th:block>

<div class="container py-4">
    <a href="/admin/meal-plans" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left"></i> All meal plans</a>
    <h2 class="section-title mt-2 mb-4">Meal plan</h2>

    <div class="card neon">
        <div class="card-body">
            <table class="table table-dark">
                <tbody>
                <tr><th class="w-25">Client</th><td><a th:href="@{/admin/users/{id}(id=${user.id})}" th:text="${user.email}">email</a></td></tr>
                <tr><th>Created</th><td th:text="${plan.createdAt != null ? #temporals.format(plan.createdAt, 'MMM d, yyyy h:mm a') : ''}">date</td></tr>
                <tr><th>Profile</th><td th:text="${plan.weight} + ' lb, ' + ${plan.heightFeet} + ' ft ' + ${plan.heightInches} + ' in, age ' + ${plan.age} + ', ' + ${plan.activityLevel} + ', ' + ${plan.fitnessGoal}">profile</td></tr>
                <tr><th>Targets</th><td th:text="${plan.targetCalories} + ' cal · ' + ${plan.targetProtein} + 'g protein · ' + ${plan.targetCarbs} + 'g carbs · ' + ${plan.targetFat} + 'g fat'">targets</td></tr>
                <tr th:if="${plan.actualCalories != null}"><th>Plan actuals</th><td th:text="${plan.actualCalories} + ' cal · ' + ${plan.actualProtein} + 'g protein · ' + ${plan.actualCarbs} + 'g carbs · ' + ${plan.actualFat} + 'g fat'">actuals</td></tr>
                <tr><th>Accuracy</th><td th:text="${plan.accuracyScore != null ? plan.accuracyScore + '%' : 'Not scored'}">0</td></tr>
                <tr><th>Status</th><td>
                    <span th:if="${plan.generationFailed}" class="badge bg-danger">Failed</span>
                    <span th:unless="${plan.generationFailed}" class="badge text-bg-primary">Generated</span>
                </td></tr>
                <tr th:if="${plan.errorMessage}"><th>Error</th><td th:text="${plan.errorMessage}">err</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
