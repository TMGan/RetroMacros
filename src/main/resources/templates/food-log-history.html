<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>7-Day History - Retro Macros</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="neon">
<div th:replace="~{fragments/navbar :: authenticated-navbar}"></div>

<div class="container today">
    <header class="today-head">
        <div>
            <h1 class="today-title">Past 7 days</h1>
            <p class="today-date">What you logged each day, newest first.</p>
        </div>
        <a href="/dashboard" class="today-link"><i class="bi bi-arrow-left"></i> Today</a>
    </header>

    <section class="card neon">
        <div class="card-body p-4">
            <p class="text-muted mb-0" th:if="${foodLogs == null || foodLogs.isEmpty()}">Nothing logged in the last 7 days.</p>
            <div th:if="${foodLogs != null && !foodLogs.isEmpty()}">
                <div class="history-day" th:each="date : ${dailyTotalsMap.keySet()}" th:with="totals=${dailyTotalsMap.get(date)}">
                    <div class="history-day-head">
                        <h2 class="today-section-title" th:text="${#temporals.format(date, 'EEEE, MMM d')}">Wednesday, Oct 21</h2>
                        <span class="log-macros" th:if="${totals.get('calories') > 0}"
                              th:text="${totals.get('calories')} + ' cal · ' + ${totals.get('protein')} + 'g protein · ' + ${totals.get('carbs')} + 'g carbs · ' + ${totals.get('fat')} + 'g fat'">1330 cal</span>
                    </div>
                    <ul class="log-list" th:if="${totals.get('calories') > 0}">
                        <li th:each="log : ${foodLogs}" th:if="${log.logDate.equals(date)}">
                            <div class="log-main">
                                <div class="log-meal"><span th:text="${log.mealName}">Lunch</span> · <span th:text="${#temporals.format(log.timeLogged, 'h:mm a')}">12:00 PM</span></div>
                                <div class="log-desc" th:text="${log.foodDescription}">chicken and rice</div>
                                <div class="log-macros" th:text="${log.calories} + ' cal · ' + ${log.protein} + 'g protein · ' + ${log.carbs} + 'g carbs · ' + ${log.fat} + 'g fat'">710 cal</div>
                            </div>
                        </li>
                    </ul>
                    <p class="text-muted small mb-0" th:unless="${totals.get('calories') > 0}">Nothing logged.</p>
                </div>
            </div>
        </div>
    </section>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
