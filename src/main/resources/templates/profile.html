<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile - Retro Macros</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="neon">
<div th:replace="~{fragments/navbar :: authenticated-navbar}"></div>

<div class="container my-5" style="max-width: 760px;">
    <div th:if="${success}" class="alert alert-success" th:text="${success}">Saved</div>

    <!-- Who you are -->
    <section class="card neon mb-4">
        <div class="card-body p-4 profile-head">
            <img th:if="${user.profilePictureUrl != null}" th:src="${user.profilePictureUrl}" alt="" class="profile-photo">
            <div th:unless="${user.profilePictureUrl != null}" class="profile-photo profile-initial" th:text="${#strings.substring(user.name, 0, 1)}">D</div>
            <div class="flex-grow-1">
                <h1 class="profile-name" th:text="${user.name}">User Name</h1>
                <div class="profile-meta" th:text="${user.email}">email@example.com</div>
                <div class="profile-meta" th:text="'Member since ' + ${memberSince} + ' · ' + ${totalPlans} + (${totalPlans == 1} ? ' plan' : ' plans')">Member since</div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-sm btn-outline-neon"><i class="bi bi-box-arrow-right"></i> Sign out</button>
            </form>
        </div>
    </section>

    <!-- Food preferences: used every time a plan is made -->
    <section class="card neon" id="preferences">
        <div class="card-body p-4">
            <h2 class="wizard-heading">Food preferences</h2>
            <p class="wizard-sub">Your plans use these every time. Allergies are asked separately when you make a plan.</p>
            <form th:action="@{/preferences/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="mb-3">
                    <label class="form-label" for="preferredFoods">Foods you like</label>
                    <textarea class="form-control" id="preferredFoods" name="preferredFoods" rows="2" maxlength="1000"
                              placeholder="e.g. chicken, salmon, rice, sweet potatoes, berries" th:text="${userPreferences?.preferredFoodsText}"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="avoidedFoods">Foods to leave out</label>
                    <textarea class="form-control" id="avoidedFoods" name="avoidedFoods" rows="2" maxlength="1000"
                              placeholder="e.g. mushrooms, tofu, quinoa" th:text="${userPreferences?.avoidedFoodsText}"></textarea>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="cookingPreference">How you usually eat</label>
                        <select class="form-select" id="cookingPreference" name="cookingPreference" th:with="cp=${userPreferences?.cookingPreference}">
                            <option value="mostly-home-cooked" th:selected="${cp == 'mostly-home-cooked'}">Mostly home-cooked</option>
                            <option value="mixed" th:selected="${cp == 'mixed'}">Mix of home-cooked and eating out</option>
                            <option value="convenience-focused" th:selected="${cp == 'convenience-focused'}">Convenience first (meal prep, frozen, eating out)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="dietaryStyle">Diet style</label>
                        <select class="form-select" id="dietaryStyle" name="dietaryStyle" th:with="ds=${userPreferences?.dietaryStyle}">
                            <option value="flexible" th:selected="${ds == 'flexible'}">Flexible</option>
                            <option value="mostly-whole-foods" th:selected="${ds == 'mostly-whole-foods'}">Mostly whole foods</option>
                            <option value="whole-foods-only" th:selected="${ds == 'whole-foods-only' or ds == 'clean-eating'}">Whole foods only</option>
                            <option value="vegetarian" th:selected="${ds == 'vegetarian'}">Vegetarian</option>
                            <option value="vegan" th:selected="${ds == 'vegan'}">Vegan</option>
                            <option value="pescatarian" th:selected="${ds == 'pescatarian'}">Pescatarian</option>
                        </select>
                    </div>
                </div>
                <div class="text-end mt-4"><button type="submit" class="btn btn-neon">Save preferences</button></div>
            </form>
        </div>
    </section>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
